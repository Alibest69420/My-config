# Generated by HyprMod

decoration:active_opacity = 0.83
decoration:blur:ignore_opacity = true
decoration:blur:noise = 0.0
decoration:blur:passes = 2
decoration:blur:xray = true
dwindle:force_split = 0
dwindle:permanent_direction_override = true
dwindle:preserve_split = false
dwindle:smart_resizing = true
dwindle:smart_split = false
ecosystem:no_donation_nag = true
general:border_size = 1
general:extend_border_grab_area = 10
general:gaps_in = 2
general:gaps_out = 2
input:kb_layout = us
master:new_on_active = after
master:new_on_top = false
master:orientation = right
misc:disable_autoreload = false
misc:vrr = 3

# Bezier curves
bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1.0
bezier = md3_standard, 0.2, 0.0, 0.0, 1.0
bezier = menu_accel, 0.52, 0.03, 0.72, 0.08

# Animations
animation = layers, 1, 1.5, md3_standard
animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
animation = layersOut, 1, 2.4, menu_accel, popin 94%

# Keybinds
unbind = SUPER SHIFT, P
bind = SUPER SHIFT, P, exec, loffice --impress
