## Steam Rules
windowrule = workspace 4 silent, match:initial_class ^([Ss]team)$
windowrule = float on, match:title ^([Ss]team)$
windowrule = float on, match:class ^([Ss]team)$
windowrule = float on, match:initial_class ^([Ss]team)$
windowrule = center on, match:title ^(Sign in to Steam)$
windowrule = opacity 1 override, match:class steam
windowrule = float on, match:initial_title ^(Friends List)$

## Steam Games
windowrule = workspace 1, match:class ^steam_app_[0-9]+$
windowrule = idle_inhibit always, match:class ^steam_app_[0-9]+$
windowrule = immediate on, match:class ^steam_app_[0-9]+$
windowrule = opacity 1 override, match:class ^steam_app_[0-9]+$
windowrule = content game, match:class ^steam_app_[0-9]+$
windowrule = center on, match:class ^steam_app_[0-9]+$
